<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMAVIS - Loading Screen</title>
    <!-- Memuat Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@500&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .loading-container {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #0C4A6E 0%, #164E63 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 80px 20px 60px 20px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
            width: 100%;
        }

        .logo-box {
            width: 200px;
            height: 200px;
            background-color: white;
            box-shadow: 0px 12px 24px rgba(8, 145, 178, 0.25);
            border-radius: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-initial {
            color: #0891B2;
            font-size: 100px;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            line-height: 1;
        }

        .brand-title {
            color: white;
            font-size: 44px;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .progress-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .progress-bar-bg {
            width: 420px;
            max-width: 90%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: #0891B2;
            border-radius: 9999px;
            width: 0%;
            animation: loadProgress 2.5s ease-in-out forwards;
        }

        .status-text {
            color: #67E8F9;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .version-text {
            color: rgba(56, 189, 248, 0.38);
            font-size: 12px;
            font-weight: 500;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            20% { width: 15%; }
            50% { width: 65%; }
            80% { width: 85%; }
            100% { width: 100%; }
        }

        @media (max-width: 480px) {
            .loading-container {
                padding: 60px 20px 40px 20px;
            }
            .logo-box {
                width: 150px;
                height: 150px;
                border-radius: 28px;
            }
            .logo-initial {
                font-size: 75px;
            }
            .brand-title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

<div class="loading-container">
    <div></div>

    <div class="main-content">
        <div class="logo-box">
            <span class="logo-initial">S</span>
        </div>
        
        <h1 class="brand-title">SIMAVIS</h1>
        
        <div class="progress-section">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill"></div>
            </div>
            <p class="status-text">Memuat data...</p>
        </div>
    </div>

    <div class="version-text">v2.0.1</div>
</div>

<!-- SKRIP REDIRECT OTOMATIS KE LOGIN -->
<script>
    setTimeout(function() {
        window.location.href = "login.html"; // Pengalihan otomatis ke halaman Login
    }, 2600);
</script>

</body>
</html>
